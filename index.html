<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CORSAIR — Voile & Canons</title>
<style>
  :root { --gold: #ffd23f; --sea: #0a3f6b; --ink: #06121f; --sky: #5fd4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: #fff; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #gl { display: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 16, 30, .62); backdrop-filter: blur(4px); z-index: 10; overflow-y: auto; touch-action: pan-y; }
  .overlay.show { display: flex; }
  .box { width: min(980px, 100%); margin: auto; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(44px, 9vw, 92px); letter-spacing: .12em; margin: 0; color: var(--gold); text-shadow: 0 4px 0 #7a4b00, 0 10px 30px rgba(0, 0, 0, .6); }
  h2 { font-family: Georgia, serif; font-size: clamp(28px, 5vw, 46px); margin: 0 0 12px; color: var(--gold); }
  .sub { letter-spacing: .32em; text-transform: uppercase; font-size: clamp(11px, 1.6vw, 15px); color: #bfe3f5; margin: 6px 0 26px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { cursor: pointer; text-align: left; padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .18); background: linear-gradient(160deg, rgba(20, 60, 95, .92), rgba(8, 28, 48, .92)); color: #fff; font: inherit; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); }
  .card .ico { font-size: 40px; } .card h3 { margin: 8px 0 6px; font-size: 22px; color: var(--gold); font-family: Georgia, serif; }
  .card p { margin: 0 0 10px; font-size: 14px; line-height: 1.45; color: #d5e8f3; } .card small { color: var(--sky); font-weight: 700; }
  .diff { margin: 22px 0 8px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 13px; color: #bfe3f5; }
  button { font: inherit; color: #fff; cursor: pointer; }
  .diff button, .btn { padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); font-weight: 700; }
  .diff button.on, .btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .btn { margin: 6px; padding: 12px 26px; font-size: 16px; } .btn:hover { filter: brightness(1.15); }
  .foot { margin-top: 14px; font-size: 12px; color: #9fc4dd; } .foot a { color: var(--sky); }
  .panel { background: rgba(8, 26, 44, .95); border: 1px solid rgba(255, 255, 255, .18); border-radius: 18px; padding: 26px; width: min(680px, 100%); margin: auto; text-align: center; }
  .panel p { color: #d5e8f3; line-height: 1.5; } .gold { color: var(--gold); font-weight: 800; }
  table.res { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 15px; } table.res td { padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, .1); text-align: left; } table.res td:last-child { text-align: right; } table.res tr.me td { color: var(--gold); font-weight: 800; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  #shop-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 16px 0; }
  .item { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 210, 63, .6); background: rgba(255, 210, 63, .08); display: flex; flex-direction: column; gap: 4px; }
  .item span { font-size: 12px; color: #bfe3f5; } .item em { font-style: normal; font-weight: 800; color: var(--gold); }
  .item.poor { opacity: .45; border-color: rgba(255, 255, 255, .2); cursor: not-allowed; } .item.own { border-color: #4cd17a; background: rgba(76, 209, 122, .1); cursor: default; } .item.own em { color: #4cd17a; }
  #mute { position: fixed; right: 10px; bottom: 6px; z-index: 12; background: none; border: 0; font-size: 18px; opacity: .7; }
  #touch .tg { position: fixed; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; }
  #touch .tl { left: 12px; bottom: 16px; } #touch .tr { right: 12px; bottom: 34px; justify-content: flex-end; max-width: 250px; } #touch .tt { left: 50%; top: 80px; transform: translateX(-50%); }
  #touch button { min-width: 58px; height: 54px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(6, 18, 32, .6); font-weight: 700; font-size: 13px; }
  #touch .tl button { width: 76px; height: 76px; font-size: 28px; } #touch button.big { flex: 1 1 100px; height: 60px; background: rgba(255, 210, 63, .22); border-color: var(--gold); } #touch .tt button { height: 38px; min-width: 44px; font-size: 12px; }
  #touch button.on { background: rgba(95, 212, 255, .45); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="touch"></div>
<button id="mute" title="Son (M)">🔊</button>

<div id="menu" class="overlay show">
  <div class="box">
    <h1>CORSAIR</h1>
    <div class="sub">Voile &amp; Canons — trois façons de dompter le vent</div>
    <div class="cards">
      <button class="card" data-mode="imoca"><div class="ico">⛵</div><h3>IMOCA — Course au large</h3>
        <p>Un parcours de six portes entre les îles. Choisissez la bonne voile d’avant, déployez les foils et volez à plus de 30 nœuds… sans déchirer le spi dans les grains.</p><small id="rec-imoca"></small></button>
      <button class="card" data-mode="dinghy"><div class="ico">🚩</div><h3>Voile légère — Régate</h3>
        <p>Départ au chrono, deux tours de banane en dériveur. Bordez, choquez, sortez au rappel dans les risées, jouez les bascules — et évitez le dessalage.</p><small id="rec-dinghy"></small></button>
      <button class="card" data-mode="pirate"><div class="ico">🏴‍☠️</div><h3>Bataille pirate</h3>
        <p>Bordées de canons, vent de travers et butin. Repoussez des vagues de plus en plus féroces, pillez les marchands et armez votre navire jusqu’au vaisseau de ligne.</p><small id="rec-pirate"></small></button>
    </div>
    <div class="diff">Niveau des adversaires en régate :
      <button data-d="0">Mousse</button><button data-d="1">Skipper</button><button data-d="2">Légende</button></div>
    <div class="foot">Clavier : flèches + touches indiquées en jeu · tactile pris en charge · C change de vue (cockpit, poursuite, ciel) · M coupe le son · <a href="classic.html">ancienne version</a></div>
  </div>
</div>

<div id="pause" class="overlay"><div class="panel"><h2>Pause</h2>
  <button class="btn primary" id="resume">Reprendre</button><button class="btn" id="restart">Recommencer</button><button class="btn" id="quit">Menu</button></div></div>

<div id="end" class="overlay"><div class="panel"><h2 id="end-title"></h2><div id="end-body"></div>
  <button class="btn primary" id="again">Rejouer</button><button class="btn" id="end-menu">Menu</button></div></div>

<div id="shop" class="overlay"><div class="panel"><h2>Chantier naval</h2>
  <div class="gold" style="font-size:22px">💰 <span id="shop-gold">0</span> pièces d’or</div>
  <div id="shop-items"></div><button class="btn primary" id="shop-close">Reprendre la mer</button></div></div>

<script src="js/vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/race.js"></script>
<script src="js/pirate.js"></script>
<script src="js/view3d.js"></script>
<script src="js/main.js"></script>
</body>
</html>
